# Opcional: provisioning automático del datasource.
# Copiar a /etc/grafana/provisioning/datasources/ y reiniciar Grafana:
#   sudo cp datasource-mysql.yaml /etc/grafana/provisioning/datasources/
#   sudo systemctl restart grafana-server
# (También se puede crear a mano desde Connections → Data sources → MySQL.)
apiVersion: 1
datasources:
  - name: Invernadero MySQL
    type: mysql
    uid: invernadero-mysql
    url: localhost:3306
    user: grafana
    jsonData:
      database: invernadero
      maxOpenConns: 10
    secureJsonData:
      password: grafana123
